<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI English Native LMS – Learner Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a17;--bg2:#0a1022;--panel:#0e1530;--panel2:#131c3d;--panel3:#18234a;
  --line:rgba(150,170,255,.14);--line2:rgba(150,170,255,.24);
  --tx:#eaeefb;--mut:#a3aed0;--dim:#74809f;
  --cyan:#22d3ee;--teal:#2dd4bf;--violet:#8b7bff;--blue:#4f86ff;--amber:#f5b84b;--rose:#fb7185;--green:#34d399;--red:#ff6b81;
  --ac:#22d3ee;
  --r:18px;--sh:0 10px 40px rgba(0,0,0,.35);
  --f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f);color:var(--tx);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(139,123,255,.16),transparent 60%),radial-gradient(800px 500px at -5% 10%,rgba(34,211,238,.10),transparent 60%),linear-gradient(rgba(150,170,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(150,170,255,.035) 1px,transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:12px clamp(14px,3vw,32px);background:rgba(6,10,23,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.01em;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#04101f;font-weight:800;font-size:14px;box-shadow:0 4px 18px rgba(34,211,238,.35)}
.brand small{display:block;font-size:10.5px;color:var(--mut);font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
.tprog{flex:1;max-width:520px;margin-left:auto;display:none}
.tprog.on{display:block}
.tprog .row{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--teal));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tright{display:flex;gap:10px;align-items:center;margin-left:auto}
.tprog.on~.tright{margin-left:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--mut);white-space:nowrap}
.chip.xp{color:var(--amber);border-color:rgba(245,184,75,.35);background:rgba(245,184,75,.08)}
.iconbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-size:13px;font-weight:600;color:var(--tx)}
.iconbtn:hover{background:rgba(255,255,255,.09)}
.simbar{display:flex;gap:10px;align-items:center;justify-content:center;padding:7px 14px;font-size:12px;color:#c9d2f1;background:linear-gradient(90deg,rgba(139,123,255,.16),rgba(34,211,238,.12));border-bottom:1px solid var(--line);text-align:center}
.simbar b{color:var(--cyan)}
.simbar button{background:none;border:0;color:var(--cyan);text-decoration:underline;font-size:12px;padding:0;font-weight:700}

/* layout */
.layout{display:grid;grid-template-columns:1fr;max-width:1280px;margin:0 auto;padding:clamp(14px,2.5vw,30px);gap:24px}
.layout>*{min-width:0}
.layout.withrail{grid-template-columns:268px minmax(0,1fr)}
#rail{display:none}
.withrail #rail{display:block}
.rail{position:sticky;top:84px;align-self:start}
.rail h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:2px 8px 12px}
.rail ol{list-style:none;margin:0;padding:0;position:relative}
.rail li{position:relative}
.rail li::before{content:"";position:absolute;left:23px;top:44px;bottom:-4px;width:2px;background:var(--line2)}
.rail li:last-child::before{display:none}
.rail li.done::before{background:linear-gradient(var(--teal),var(--cyan))}
.rbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 10px;border-radius:14px;border:1px solid transparent;background:none;position:relative;z-index:1;transition:.2s}
.rbtn:hover:not([disabled]){background:rgba(255,255,255,.05)}
.rbtn[disabled]{cursor:not-allowed;opacity:.55}
.rdot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:var(--bg2);color:var(--dim);flex:none;font-size:13px;font-weight:700;transition:.3s}
.rtxt b{display:block;font-size:13.5px;font-weight:700;line-height:1.25}
.rtxt span{font-size:11.5px;color:var(--dim)}
li.cur .rbtn{background:linear-gradient(90deg,rgba(34,211,238,.13),rgba(139,123,255,.07));border-color:var(--line2)}
li.cur .rdot{border-color:var(--ac);color:var(--ac);box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 18%,transparent)}
li.done .rdot{background:linear-gradient(135deg,var(--teal),var(--cyan));border-color:transparent;color:#04101f}
li.done .rtxt span{color:var(--teal)}

/* cards & basics */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,2.6vw,30px);box-shadow:var(--sh)}
.card.flat{box-shadow:none;background:rgba(255,255,255,.03)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--ac)}
.lead{color:var(--mut);font-size:16.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:13px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-weight:700;font-size:15px;transition:.2s}
.btn:hover:not([aria-disabled=true]){background:rgba(255,255,255,.1);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#4f6bff,#7b61ff 55%,#22b8e8);border-color:transparent;color:#fff;box-shadow:0 8px 26px rgba(91,107,255,.4)}
.btn.primary:hover:not([aria-disabled=true]){box-shadow:0 12px 32px rgba(91,107,255,.55)}
.btn.good{background:linear-gradient(135deg,#0fb890,#18c7d6);color:#03151a;border-color:transparent;box-shadow:0 8px 24px rgba(20,200,180,.3)}
.btn.lg{padding:15px 28px;font-size:16.5px;border-radius:15px}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;box-shadow:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--mut)}
.tag.sim{color:#c7b8ff;border-color:rgba(139,123,255,.5);background:rgba(139,123,255,.12)}
.tag.real{color:#7ff0d3;border-color:rgba(45,212,191,.45);background:rgba(45,212,191,.1)}
.tag.cyan{color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}

/* dashboard */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.35fr .9fr;gap:30px;padding:clamp(22px,3.5vw,44px);border-radius:26px;border:1px solid var(--line2);background:radial-gradient(600px 300px at 90% 0,rgba(139,123,255,.28),transparent 60%),radial-gradient(500px 300px at 0 100%,rgba(34,211,238,.18),transparent 60%),linear-gradient(180deg,#111a3b,#0b1230)}
.hero h1{font-size:clamp(30px,4.4vw,52px);font-weight:800;letter-spacing:-.025em;margin:14px 0 14px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 24px}
.meta .chip{font-size:13px;padding:7px 13px}
.ctaRow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:34px;font-weight:800;display:block;line-height:1}
.ring .c span{font-size:12px;color:var(--mut)}
.objlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.objlist li{display:flex;gap:12px;align-items:flex-start;color:#d5dcf4;font-size:14.5px}
.objlist .ic{color:var(--teal);margin-top:3px}
.secT{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:36px 0 16px;flex-wrap:wrap}
.secT h2{font-size:22px}
.secT p{color:var(--mut);font-size:14px}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.scard{position:relative;text-align:left;border-radius:16px;padding:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));transition:.25s;overflow:hidden;display:flex;gap:14px;align-items:flex-start;width:100%}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}
.scard:hover:not([disabled]){transform:translateY(-3px);border-color:var(--line2)}
.scard[disabled]{cursor:default}
.sico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac);flex:none;font-size:20px}
.scard small{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ac);text-transform:uppercase}
.scard b{display:block;font-size:15px;margin:2px 0}
.scard p{font-size:12.5px;color:var(--mut)}
.scard .st{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;color:var(--teal)}
.transform{display:grid;grid-template-columns:1fr 70px 1.5fr;gap:14px;align-items:center}
.doc{padding:16px;border-radius:14px;border:1px dashed var(--line2);background:rgba(255,255,255,.03);font-size:13px;color:var(--mut)}
.doc .l{height:7px;border-radius:5px;background:rgba(255,255,255,.12);margin:8px 0}
.doc b{color:var(--tx);display:flex;gap:8px;align-items:center;font-size:13.5px}
.arrowc{display:grid;place-items:center;color:var(--cyan);font-size:30px}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.mini{padding:5px 9px;border-radius:8px;font-size:11.5px;font-weight:700;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 30%,transparent)}

/* stage */
.stagewrap{display:grid;gap:18px}
.stagewrap.enter{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.shead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.shead .sico{width:54px;height:54px;font-size:26px;border-radius:16px}
.shead h2{font-size:clamp(23px,3vw,32px);font-weight:800}
.shead .sub{color:var(--mut);font-size:14px;margin-top:3px}
.shead .step{margin-left:auto}
.dnote{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025);padding:0}
.dnote summary{cursor:pointer;list-style:none;padding:11px 16px;font-size:13px;font-weight:700;color:var(--mut);display:flex;gap:9px;align-items:center}
.dnote summary::-webkit-details-marker{display:none}
.dnote[open] summary{color:var(--ac)}
.dnote p{padding:0 16px 14px 42px;font-size:13.5px;color:var(--mut)}
.qtitle{font-size:clamp(19px,2.2vw,24px);font-weight:700;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.opts.c1{grid-template-columns:1fr}
.opts4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line2);background:rgba(255,255,255,.04);font-size:16px;font-weight:600;transition:.18s;min-height:56px}
.opt .k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:12.5px;font-weight:800;color:var(--mut);flex:none}
.opt:hover:not([disabled]){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,transparent);transform:translateY(-1px)}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.opt.ok{border-color:var(--green);background:rgba(52,211,153,.14)}
.opt.ok .k{background:var(--green);color:#03150f}
.opt.no{border-color:var(--red);background:rgba(255,107,129,.12);animation:shake .4s}
.opt.no .k{background:var(--red);color:#1a0509}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:16px;border-radius:14px;padding:16px 18px;border:1.5px solid;animation:rise .35s}
.fb.ok{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.09)}
.fb.bad{border-color:rgba(255,107,129,.55);background:rgba(255,107,129,.08)}
.fb.info{border-color:rgba(79,134,255,.55);background:rgba(79,134,255,.09)}
.fb h4{font-size:15px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fb.ok h4{color:var(--green)}.fb.bad h4{color:var(--red)}.fb.info h4{color:#8fb0ff}
.fbrow{display:grid;grid-template-columns:104px 1fr;gap:6px 12px;font-size:14.5px;margin-top:6px}
.fbrow dt{color:var(--dim);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:3px}
.fbrow dd{margin:0;color:#e1e6fa}
.hl{color:var(--cyan);font-weight:800}
mark{background:rgba(34,211,238,.2);color:#8cf0ff;padding:1px 5px;border-radius:6px;font-weight:800}
mark.v{background:rgba(52,211,153,.2);color:#7cf0c0}
mark.n{background:rgba(245,184,75,.2);color:#ffd88a}
mark.s{background:rgba(139,123,255,.25);color:#cfc7ff}
mark.a{background:rgba(245,184,75,.2);color:#ffd88a}
.bigquote{font-size:clamp(20px,3vw,30px);font-weight:700;line-height:1.35}
.pillrow{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line2);background:rgba(255,255,255,.04);font-weight:700;font-size:14px;transition:.18s}
.pill:hover{border-color:var(--ac)}
.pill.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent);color:#fff}
.mono{font-family:var(--mono)}

/* s1 */
.dilemma{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}
.dcard{position:relative;border-radius:20px;padding:26px 22px;text-align:center;border:2px solid var(--line2);background:rgba(255,255,255,.04);transition:.35s;font-size:clamp(20px,2.6vw,28px);font-weight:700;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:14px;width:100%}
.dcard small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800}
.dcard:hover{transform:translateY(-3px)}
.dcard.sel{border-color:var(--amber);box-shadow:0 0 0 6px rgba(245,184,75,.12)}
.dcard.reveal.bad{border-color:rgba(255,107,129,.6);background:rgba(255,107,129,.07)}
.dcard.reveal.good{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.08)}
.dcard .x{display:inline-block;transition:.5s;border-bottom:3px dashed var(--red);padding:0 2px;color:#ffb0bb}
.dcard .s{display:inline-block;color:var(--green);font-size:1.25em;animation:pop .6s}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.6)}100%{transform:scale(1);opacity:1}}

/* s2 */
.outc{display:grid;gap:14px;margin-top:14px}
.oc{display:grid;grid-template-columns:48px 1fr auto;gap:16px;align-items:center;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.035)}
.oc .num{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);font-weight:800;font-size:20px}
.oc b{display:block;font-size:16px}
.oc p{font-size:13.5px;color:var(--mut);margin-top:2px}
.conf{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.conf .pill{min-width:48px;text-align:center}

/* s3/s4 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:10px 16px;border-radius:12px;border:1.5px solid var(--line2);background:rgba(255,255,255,.04);font-weight:700;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.tab.sel{background:color-mix(in srgb,var(--ac) 18%,transparent);border-color:var(--ac)}
.tab .ic{color:var(--teal);width:1em}
.formula{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
.fpart{padding:9px 14px;border-radius:11px;font-weight:700;font-size:15px;border:1.5px solid}
.fp-s{color:#cfc7ff;border-color:rgba(139,123,255,.6);background:rgba(139,123,255,.14)}
.fp-a{color:#ffd88a;border-color:rgba(245,184,75,.6);background:rgba(245,184,75,.12)}
.fp-v{color:#7cf0c0;border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.12)}
.fp-n{color:#ffb0bb;border-color:rgba(251,113,133,.6);background:rgba(251,113,133,.12)}
.fp-o{color:var(--mut);border-color:var(--line2);background:rgba(255,255,255,.04)}
.plus{color:var(--dim);font-weight:800}
.sentence{font-size:clamp(22px,3.2vw,34px);font-weight:700;padding:22px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid var(--line);margin:14px 0;text-align:center}
.rulecard{padding:18px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.03)}
.rulecard h4{font-size:15px;margin-bottom:8px}
.rulecard ul{margin:8px 0 0;padding-left:18px;color:var(--mut);font-size:14px}
.rulecard li{margin:4px 0}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2)}
table.t td{padding:10px;border-bottom:1px solid var(--line)}
.contrast{display:grid;grid-template-columns:1fr 36px 1fr;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);margin-bottom:12px}
.contrast .w,.contrast .r{padding:12px 14px;border-radius:11px;font-weight:600;font-size:16px}
.contrast .w{background:rgba(255,107,129,.1);border:1px solid rgba(255,107,129,.45);color:#ffc3cb}
.contrast .r{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.45);color:#b5f5d9}
.contrast .w s{text-decoration-color:var(--red)}
.contrast .note{grid-column:1/-1;font-size:13px;color:var(--mut)}
.field{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line2);background:rgba(0,0,0,.3);color:var(--tx);font:inherit;font-size:16px}
textarea.field{min-height:170px;resize:vertical;line-height:1.6}
.field:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.15)}

/* s5 */
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 20px}
.stp{padding:12px 14px;border-radius:14px;border:1.5px solid var(--line2);display:flex;gap:11px;align-items:center;font-weight:700;font-size:14px;background:rgba(255,255,255,.03)}
.stp i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:13px;flex:none}
.stp.cur{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.stp.cur i{background:var(--ac);color:#04140d}
.stp.done{border-color:rgba(52,211,153,.5)}
.stp.done i{background:var(--green);color:#04140d}
.wordrow{display:flex;gap:10px;flex-wrap:wrap;font-size:clamp(20px,2.8vw,28px);font-weight:700;margin:12px 0;align-items:center}
.wbtn{padding:6px 12px;border-radius:10px;border:1.5px dashed var(--line2);background:rgba(255,255,255,.04);font-weight:700;font-size:inherit}
.wbtn:hover{border-color:var(--ac);border-style:solid}
.wbtn.ok{border-style:solid;border-color:var(--green);background:rgba(52,211,153,.15)}
.wbtn.no{border-color:var(--red);animation:shake .4s}
.pit{border:1.5px solid rgba(251,113,133,.55);background:rgba(251,113,133,.07);border-radius:16px;padding:18px}
.pit h4{color:#ffa3b0;display:flex;gap:8px;align-items:center;font-size:14px;letter-spacing:.06em;text-transform:uppercase}

/* s6 tiles */
.dots{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.dt{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);background:none;font-weight:800;font-size:13px;display:grid;place-items:center;color:var(--mut)}
.dt.cur{border-color:var(--ac);color:var(--ac)}
.dt.ok{background:var(--green);border-color:var(--green);color:#03150f}
.tiles{display:flex;gap:10px;flex-wrap:wrap;min-height:54px}
.tile{padding:11px 18px;border-radius:12px;border:1.5px solid var(--line2);background:var(--panel3);font-weight:700;font-size:17px;transition:.15s}
.tile:hover:not([disabled]){border-color:var(--ac);transform:translateY(-2px)}
.tile.used{opacity:.25;pointer-events:none}
.slot{min-height:64px;border-radius:14px;border:2px dashed var(--line2);padding:8px;background:rgba(0,0,0,.2);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.slot .ph{color:var(--dim);font-size:14px;padding-left:8px}
.slot .tile{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.slot.ok{border-color:var(--green);background:rgba(52,211,153,.07)}

/* s8 */
.qcard{padding:20px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);margin-bottom:14px}
.qcard.right{border-color:rgba(52,211,153,.5)}
.qcard.wrong{border-color:rgba(255,107,129,.5)}
.qn{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.qn .pts{margin-left:auto}
.qstem{font-size:18px;font-weight:700}
.score{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.sbig{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1}
.verdict{display:inline-flex;gap:9px;align-items:center;padding:8px 16px;border-radius:99px;font-weight:800;font-size:14px}
.verdict.pass{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.5)}
.verdict.fail{background:rgba(255,107,129,.12);color:var(--red);border:1px solid rgba(255,107,129,.5)}
.meter{position:relative;height:14px;border-radius:99px;background:rgba(255,255,255,.08);margin:18px 0 6px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .8s}
.meter u{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--amber);left:70%}
.meter u::after{content:"70% pass";position:absolute;top:-20px;left:-24px;font-size:11px;color:var(--amber);font-weight:800;text-decoration:none;white-space:nowrap}

/* s9 */
.ck{display:grid;gap:10px;margin:14px 0}
.ckr{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line2);font-size:14.5px;font-weight:600;transition:.3s;background:rgba(255,255,255,.03)}
.ckr .b{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent}
.ckr.on{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.09)}
.ckr.on .b{background:var(--green);border-color:var(--green);color:#03150f}
.ckr small{margin-left:auto;color:var(--dim);font-weight:600}
.w9wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.aibar{display:grid;grid-template-columns:130px 1fr 44px;gap:12px;align-items:center;font-size:13.5px;margin:10px 0}
.aibar .bar{height:10px}
.prev{padding:16px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:16px;line-height:1.9;white-space:pre-wrap}

/* done */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{padding:18px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.stat small{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:800}
.stat b{display:block;font-size:34px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--mut)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{display:flex;gap:11px;align-items:center;padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:13px;font-weight:700}
.badge .sico{width:32px;height:32px;font-size:16px;border-radius:10px}
.badge.off{opacity:.4}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:108px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.hb .bar{height:12px}
.hb .bar i{background:var(--ac)}
.celebrate{text-align:center;padding:clamp(26px,4vw,52px);border-radius:26px;border:1px solid var(--line2);position:relative;overflow:hidden;background:radial-gradient(600px 260px at 50% 0,rgba(245,184,75,.2),transparent 60%),radial-gradient(500px 300px at 90% 100%,rgba(34,211,238,.16),transparent 60%),linear-gradient(180deg,#131c40,#0b1230)}
.celebrate h1{font-size:clamp(28px,4.4vw,48px);font-weight:800;margin:12px 0 8px}
.trophy{width:84px;height:84px;margin:0 auto;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--amber),#ff9e57);color:#2b1700;font-size:44px;box-shadow:0 12px 40px rgba(245,184,75,.45);animation:pop .8s}
.cf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:0;animation:fall 2.8s ease-in forwards;pointer-events:none}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(520px) rotate(720deg)}}
pre.x{background:rgba(0,0,0,.35);padding:14px;border-radius:12px;font-family:var(--mono);font-size:12px;overflow:auto;max-height:260px;color:#b7c4f0;border:1px solid var(--line);margin:10px 0 0}
details.more summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--cyan)}

/* nav footer */
#nav{position:sticky;bottom:0;z-index:35;background:linear-gradient(180deg,transparent,rgba(6,10,23,.96) 34%);padding:22px clamp(14px,3vw,32px) 16px;display:none}
#nav.on{display:block}
.navin{max-width:1280px;margin:0 auto;display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:18px;border:1px solid var(--line2);background:rgba(14,21,48,.92);backdrop-filter:blur(12px);box-shadow:0 -6px 30px rgba(0,0,0,.35)}
.hint{flex:1;text-align:center;font-size:13.5px;color:var(--mut);display:flex;gap:8px;justify-content:center;align-items:center}
.hint.ready{color:var(--green)}
.hint.nudge{animation:shake .4s;color:var(--amber)}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(2,5,14,.72);backdrop-filter:blur(6px);display:none;place-items:center;padding:18px}
.modal.on{display:grid}
.mbox{max-width:760px;width:100%;max-height:88vh;overflow:auto;border-radius:22px;padding:28px;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--sh)}
.mbox h3{font-size:22px;margin-bottom:6px}
.mbox ul{margin:8px 0 0;padding-left:18px;color:#d3daf3;font-size:14px}
.mbox li{margin:5px 0}
.mclose{float:right}
.switch{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);margin-top:14px;font-size:14px}
.switch input{width:20px;height:20px;accent-color:var(--cyan)}

@media(max-width:1020px){
  .layout.withrail{grid-template-columns:minmax(0,1fr)}

 {n:1,ev:'Event 1',name:'Gain Attention',short:'Attention',sub:'Cognitive Contrast Hook',icon:'eye',ac:'#f5b84b',act:'Notice & reflect',min:1,

 opts:[{t:'My sister not likes spicy food.',e:'neg',err:'“not” can’t sit alone before the verb, and the -s is still attached.',rule:'Negatives: <b>doesn’t + base verb</b>.',ex:'My sister <b>doesn’t like</b> spicy food.'},

/* ---------- inflection & text analysis ---------- */
function inflect(v){v=v.trim().toLowerCase().replace(/[^a-z]/g,'');if(!v)return{out:'',rule:'Type a verb to see its third-person form.'};
 if(v==='have')return{out:'has',rule:'Irregular: have → has'};
 if(v==='be')return{out:'is',rule:'Irregular: be → is'};
 if(/[^aeiou]y$/.test(v))return{out:v.slice(0,-1)+'ies',rule:'Consonant + y → change y to ‑ies'};
 if(/(ch|sh|ss|x|z|o)$/.test(v))return{out:v+'es',rule:'Ends in -ch / -sh / -ss / -x / -z / -o → add ‑es'};
 return{out:v+'s',rule:'Most verbs → add ‑s'};}
const BASEV=['work','go','eat','drink','start','finish','wake','get','take','read','watch','play','study','teach','cook','travel','leave','arrive','check','manage','run','make','like','relax','walk','drive','write','call','meet','attend','prepare','sleep','spend','answer','review','begin','do','enjoy','prefer','want','need','live','help','join','visit','catch','plan','open','close','ride','shower','commute','relax','train','lead','hold'];
const ADV='always|usually|often|never|sometimes|rarely|also|then|really|normally|generally';
const ROUTINE=['wake','wakes','breakfast','commute','commutes','office','lunch','evening','morning','afternoon','usually','always','never','often','sometimes','every','daily','weekend','weekends','gym','dinner','bus','train','meeting','meetings','emails','email','work','works','sleep','sleeps','home','o’clock','am','pm','schedule','coffee','studio','team','shift','shifts','night','gets','arrives','starts','finishes','leaves','walks','drives','cooks','reads','reviews','manages','runs','takes','goes','eats','drinks'];
function analyze(raw){
  const text=(raw||'').replace(/[’‘`]/g,"'");
  const words=(text.match(/[A-Za-z']+/g)||[]);
  const sentences=text.split(/[.!?]+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).filter(Boolean).length>=3);
  const tp=[];const errs=[];
  const stop=new Set(['is','was','this','his','as','us','its','always','sometimes','usually','has_','does','yes','across','business','less','miss']);
  let m;const re1=new RegExp("\\b(he|she)\\s+(?:(?:"+ADV+")\\s+)?([a-z']+)\\b","gi");
  while((m=re1.exec(text))){const v=m[2].toLowerCase();const full=m[0];
    if(v==="doesn't"||v==='does'||v==="don't"||v==='is'||v==='was'||v==='has_')continue;
    if(/^(?:and|but|because|so|to|at|in|on|for|a|the|my|her|his|with)$/.test(v))continue;
    if(BASEV.includes(v)&&!/s$/.test(v)){errs.push({type:'missing_s',text:full,fix:full.replace(new RegExp(v+'$','i'),inflect(v).out)})}
    else if(/(s)$/.test(v)&&!stop.has(v)&&v.length>2)tp.push(v);}
  const re2=new RegExp("\\b([A-Z][a-z]{2,})\\s+(?:(?:"+ADV+")\\s+)?([a-z]+s)\\b","g");
  while((m=re2.exec(text))){const v=m[2];if(!stop.has(v)&&!['This','His','Her','Every','Then','However','After','Before','Because'].includes(m[1])&&!tp.includes(v))tp.push(v)}
  const re3=/\b(he|she)\s+(don't|do not)\b/gi;while((m=re3.exec(text)))errs.push({type:'aux',text:m[0],fix:m[0].replace(/don't|do not/i,"doesn't")});
  const negs=[];const re4=/\b(doesn't|does not)\s+([a-z]+)\b/gi;
  while((m=re4.exec(text))){const v=m[2].toLowerCase();
    if(/s$/.test(v)&&!/(ss|us|is)$/.test(v)&&v.length>2){errs.push({type:'double',text:m[0],fix:m[1]+' '+v.replace(/ies$/,'y').replace(/(ch|sh|ss|x|o)es$/,'$1').replace(/s$/,'')})}
    else negs.push(m[0]);}
  const low=text.toLowerCase();const vocab=[...new Set(ROUTINE.filter(w=>new RegExp("(^|[^a-z'])"+w.replace(/'/g,"['’]")+"([^a-z']|$)").test(low)))];
  const link=/\b(however|but|because|then|after|before|while|and then|also)\b/i.test(text);
  return{words:words.length,sentences:sentences.length,tp:[...new Set(tp)],negs,errs,vocab,link,text};
}

 {ok:a.tp.length>=2&&a.errs.filter(e=>e.type==='missing_s').length===0,txt:'Two third-person singular verbs (-s / -es)',det:a.tp.length+'/2'},
 {ok:a.negs.length>=1,txt:'One negative with doesn’t + base verb',det:Math.min(a.negs.length,1)+'/1'},
 {ok:a.vocab.length>=4,txt:'Routine vocabulary (e.g. wake up, commute, usually)',det:Math.min(a.vocab.length,4)+'/4'},
 {ok:a.sentences>=3&&a.errs.length===0,txt:'3+ sentences, no grammar slips detected',det:a.sentences+' sent.'}]}

  const all=checklist(a).every(c=>c.ok);$('#bsub').setAttribute('aria-disabled',all?'false':'true');$('#bfb').setAttribute('aria-disabled',a.words>=8?'false':'true');save()}
 else if(t.id==='w7'){S.d.s7.text=t.value;save()}
 else if(t.id==='infin'){S.d.s4.inf=t.value;const r=inflect(t.value);$('#infout').textContent=r.out||'…';$('#infrule').textContent=r.rule;save()}});

/* ---------- modal ---------- */
function openModal(k){const m=$('#modal'),b=$('#mbox');
 if(k==='menu')b.innerHTML=`<button class="btn sm mclose" data-close>Close ✕</button><h3>Preview tools</h3><p style="color:var(--mut);font-size:14px">For stakeholders exploring the learner experience.</p>
  <label class="switch"><input type="checkbox" id="unl" ${S.unlockAll?'checked':''}><span><b>Free navigation</b><br><span style="color:var(--mut);font-size:13px">Unlock every stage without completing the previous ones (the learner view locks upcoming stages).</span></span></label>
  <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" id="rst">↺ Reset session</button><button class="btn" id="abt">What’s real vs simulated?</button></div>`;
 else b.innerHTML=`<button class="btn sm mclose" data-close>Close ✕</button><h3>What’s real vs simulated</h3><p style="color:var(--mut);font-size:14px">This is a front-end preview. Nothing leaves your browser.</p>
  <h4 style="margin:18px 0 4px"><span class="tag real">${ic('check')} Implemented and functional</span></h4><ul><li>Nine-stage navigation with locked / current / completed states, Back and Continue</li><li>Answer checking with misconception-specific feedback and retries</li><li>Five-question assessment with real scoring, 70% threshold, review and retry</li><li>Progress, XP, time-on-stage and error-pattern tracking (kept for this browser session)</li><li>Live success checklist on the writing task using transparent, rule-based text checks</li></ul>
  <h4 style="margin:18px 0 4px"><span class="tag sim">${ic('spark')} Simulated</span></h4><ul><li><b>AI course generation</b> — the nine stages are pre-authored, not generated from an upload</li><li><b>AI writing feedback</b> — rule-based heuristics, no language model</li><li><b>Gradebook sync, teacher analytics, learning record store</b> — illustrated only; no backend, database or xAPI endpoint exists</li><li><b>XP and badges</b> — local only; not persisted across devices</li></ul>`;
 m.classList.add('on');const c=b.querySelector('[data-close]');c&&c.focus();
 const u=$('#unl');u&&u.addEventListener('change',()=>{S.unlockAll=u.checked;render()});
 const r=$('#rst');r&&r.addEventListener('click',()=>{S=fresh();closeModal();stageT0=Date.now();goView('dash')});
 const a=$('#abt');a&&a.addEventListener('click',()=>openModal('about'))}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
setInterval(()=>{if(S.view==='stage'){tick();save()}},5000);
if(S.view==='stage')lastStage=S.stage;
render();
</script>
</body>
